<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #05070d;
      --card:      rgba(255,255,255,0.05);
      --border:    rgba(255,255,255,0.10);
      --accent:    #22d3ee;
      --accent-2:  #6366f1;
      --accent-grad: linear-gradient(135deg, #22d3ee 0%, #6366f1 100%);
      --text:      #e8eef7;
      --muted:     #6b7891;
      --shadow:    0 24px 70px rgba(0,0,0,0.6);
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(40% 40% at 20% 15%, rgba(34,211,238,0.20), transparent 60%),
        radial-gradient(45% 45% at 80% 25%, rgba(99,102,241,0.18), transparent 60%),
        radial-gradient(50% 50% at 50% 100%, rgba(34,211,238,0.10), transparent 60%);
      filter: blur(22px);
      animation: drift 16s ease-in-out infinite alternate;
    }
    @keyframes drift { from { transform: translate3d(-2%,-1%,0) scale(1);} to { transform: translate3d(2%,2%,0) scale(1.06);} }
    .card {
      position: relative; z-index: 1;
      width: 360px; max-width: 92vw; padding: 48px 38px 38px;
      background: rgba(10,14,26,0.72);
      border: 1px solid var(--border);
      border-radius: 26px; text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      animation: rise 0.4s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes rise { from { opacity:0; transform: translateY(14px); } }
    .card::after {
      content: ""; position: absolute; inset: 0; border-radius: 26px; padding: 1px;
      background: var(--accent-grad); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.5; pointer-events: none;
    }
    .logo {
      font-size: 30px; font-weight: 800; letter-spacing: 11px; margin-bottom: 6px;
      background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo em { font-style: normal; -webkit-text-fill-color: var(--text); color: var(--text); }
    .sub { font-size: 11px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .hint strong { color: var(--text); font-weight: 600; }
    .key-wrap { position: relative; margin-bottom: 16px; }
    .key-input {
      width: 100%; padding: 20px 14px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border); border-radius: 16px;
      color: var(--text);
      font-size: 32px; font-weight: 700; font-family: 'SF Mono', 'Courier New', monospace;
      text-align: center; letter-spacing: 12px; text-transform: uppercase;
      outline: none; transition: border-color .15s, background .15s, box-shadow .15s; caret-color: var(--accent);
    }
    .key-input::placeholder { color: rgba(107,120,145,0.5); letter-spacing: 6px; font-size: 20px; }
    .key-input:focus { border-color: var(--accent); background: rgba(34,211,238,0.06); box-shadow: 0 0 0 4px rgba(34,211,238,0.12); }
    .err { font-size: 12px; color: var(--red); min-height: 18px; margin-bottom: 14px; }
    .btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px; cursor: pointer;
      background: var(--accent-grad); color: #04121a; font-size: 12px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase; transition: opacity .15s, transform .1s, box-shadow .2s;
      box-shadow: 0 10px 26px rgba(34,211,238,0.28);
    }
    .btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
    .shake { animation: shake 0.35s ease; }
    .voice-note { font-size: 10px; color: var(--muted); margin-top: 22px; line-height: 1.7; text-align: left; }
    .voice-note code { background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono','Courier New',monospace; font-size: 9px; }
    #reconnecting { display: none; color: var(--accent); font-size: 12px; margin-bottom: 16px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your JARVIS URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
